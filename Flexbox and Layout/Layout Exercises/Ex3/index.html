<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ex3</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Contact Form</h1>
      <h4>Get in touch with us</h4>
      <div class="container">
        <div class="form-group">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" />
        </div>
        <div class="form-group">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" />
        </div>
      </div>
      <div class="container">
        <div class="form-group">
          <label for="email-address">Email Address</label>
          <input type="email" id="email-address" />
        </div>
      </div>
      <div class="container">
        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject">
            <option value="" selected disabled>Select a topic</option>
            <option value="support">Technical Support</option>
            <option value="billing">Billing Inquiry</option>
            <option value="feedback">General Feedback</option>
          </select>
        </div>
        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div class="container">
        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            placeholder="Tell us how we can help"
          ></textarea>
        </div>
      </div>
      <div class="container">
        <div class="form-group">
          <div>Contact Prefrences</div>
          <div class="container checkbox-item">
            <input
              type="checkbox"
              id="email-updates"
              name="email-updates"
              value="email-updates"
            />
            <label for="email-updates">Email Updates</label><br />
            <input
              type="checkbox"
              id="phone-followup"
              name="phone-followup"
              value="phone-followup"
            />
            <label for="phone-followup">Phone Follow-up</label><br />
            <input
              type="checkbox"
              id="newsteller"
              name="newsteller"
              value="newsteller"
            />
            <label for="newsteller">Newsteller</label>
          </div>
        </div>
      </div>
      <div class="container">
        <button class="button draft">Save Draft</button>
        <button class="button send">Send Message</button>
      </div>
    </main>
  </body>
</html>
