<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ex2</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h3>4 boxes evenly distributed</h3>
    <div class="container">
      <div class="grow">1</div>
      <div class="grow">2</div>
      <div class="grow">3</div>
      <div class="grow">4</div>
    </div>

    <h3>2 boxes (2 and 3) are twice as big as the first</h3>
    <div class="container">
      <div class="grow">1</div>
      <div class="double-grow">2</div>
      <div class="double-grow">3</div>
    </div>
  </body>
</html>
